name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the tag matches the version in the code
        if: github.ref_type == 'tag'
        run: VEP_RELEASE_TAG=${{ github.ref_name }} go test ./internal/version -run TestVersionNoted
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/sethdotfm/sode-vep
          tags: |
            type=raw,value=latest
            type=ref,event=tag
      # The Dockerfile build runs go test, so a failing test stops the push.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: vep
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
